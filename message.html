<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message · You & Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="jsonbin-config.js"></script>
  <script defer src="script.js"></script>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand"><span class="glyph">&#10084;</span> You &amp; Me</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="memories.html">Memories</a>
      <a href="gallery.html">Gallery</a>
      <a href="message.html" class="active">Message</a>
      <a href="ourstory.html">Our Story</a>
    </div>
  </nav>

  <section class="content fade-in">
    <span class="eyebrow">For you</span>
    <h1>A Little Note</h1>
    <p class="lede">
      Every letter I've ever written you, all in one place.
    </p>

    <div class="letters-toolbar">
      <button class="btn btn-ghost" id="add-letter-btn" type="button">+ Write a new letter</button>
    </div>

    <div class="letter-form" id="letter-form" hidden>
      <textarea id="letter-textarea" class="story-textarea" rows="7" placeholder="Write what's on your heart…"></textarea>
      <div class="letter-form-actions">
        <button class="btn btn-primary" id="save-letter-btn" type="button">Save letter</button>
        <button class="btn btn-ghost" id="cancel-letter-btn" type="button">Cancel</button>
      </div>
    </div>

    <div
      class="letters-list"
      id="letters-list"
      data-fallback-date="1st Month"
      data-fallback="Happy 1st Month, My Love! ❤️
I can’t believe it has already been a whole month since we made things official. On one hand, the time has absolutely flown by because I’ve been having the absolute best time with you. On the other hand, it feels like I’ve known and loved you for a lifetime.

Before you came into my life, I didn't realize how much brighter, warmer, and happier my days could actually be. Just knowing I have you to talk to, laugh with, and lean on makes everything so much better."
    ></div>
  </section>

  <!-- Custom confirm dialog for deleting a letter — a real browser
       confirm() can get silently swallowed inside in-app browsers
       (Facebook/Instagram/Messenger link previews), so this is drawn
       on the page itself instead. Lives directly under <body>, not
       inside .content, so it's never trapped by .content's fade-in
       animation transform (see memories.html for the full
       explanation). -->
  <div class="confirm-modal" id="delete-confirm-modal" hidden>
    <div class="confirm-modal-backdrop" id="delete-confirm-backdrop"></div>
    <div class="confirm-modal-content">
      <p id="delete-confirm-message">Delete this?</p>
      <div class="confirm-modal-actions">
        <button class="btn btn-primary" id="delete-confirm-yes" type="button">Delete</button>
        <button class="btn btn-ghost" id="delete-confirm-no" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Global loading overlay, shown while a letter is being saved or
       removed. Same viewport-fixed sibling-of-body placement as the
       confirm dialog above. -->
  <div class="loading-overlay" id="loading-overlay" hidden>
    <div class="loading-spinner" aria-hidden="true"></div>
    <p id="loading-overlay-message">Loading…</p>
  </div>

  <footer>made with care, just for you</footer>
</body>
</html>
