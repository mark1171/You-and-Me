<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memories · You & Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="cloudinary-config.js"></script>
  <script defer src="jsonbin-config.js"></script>
  <script defer src="script.js"></script>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand"><span class="glyph">&#10084;</span> You &amp; Me</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="memories.html" class="active">Memories</a>
      <a href="gallery.html">Gallery</a>
      <a href="message.html">Message</a>
      <a href="ourstory.html">Our Story</a>
    </div>
  </nav>

  <section class="content content-wide fade-in">
    <span class="eyebrow">Snapshots</span>
    <h1>Our Memories</h1>
   
    <div class="memories-layout">
      <aside class="memories-filters" role="tablist" aria-label="Filter memories">
        <button class="filter-btn active" data-filter="all" type="button" role="tab" aria-selected="true">All</button>
        <button class="filter-btn" data-filter="mark" type="button" role="tab" aria-selected="false">Mark</button>
        <button class="filter-btn" data-filter="monica" type="button" role="tab" aria-selected="false">Monica</button>
        <button class="filter-btn" data-filter="us" type="button" role="tab" aria-selected="false">Us</button>

        <div class="filter-divider"></div>
        <span class="filter-label">Sort by date</span>
        <button class="filter-btn sort-btn active" data-sort="newest" type="button">Newest Photo</button>
        <button class="filter-btn sort-btn" data-sort="oldest" type="button">Oldest Photo</button>
      </aside>

      <div class="memories-grid" id="memories-grid"></div>
    </div>

    <input type="file" id="memory-file-input" accept="image/*" hidden />
  </section>

  <!-- Floating, fixed to the screen (not the grid) so it's always
       reachable no matter how far you've scrolled through photos.
       Lives directly under <body>, same as the popups below, so it's
       never trapped by .content's fade-in animation transform. -->
  <button class="fab-add-memory" id="add-memory-btn" type="button" aria-label="Add photo">
    <span class="add-icon">+</span>
    <span class="fab-label">Add photo</span>
  </button>

  <!-- Lives directly under <body> on purpose — NOT inside .content.
       .content has a fade-in animation, and once it finishes, the
       animation's final "transform: translateY(0)" sticks around
       (that's what fill-mode "both" does). Any transform, even an
       identity one, turns that element into the containing block for
       any position:fixed descendant — so this popup would end up
       fixed to .content's box instead of the actual screen, which is
       why it could appear scrolled out of view on phones. Being a
       sibling of .content instead of a child keeps it truly
       viewport-fixed no matter where you've scrolled. -->
  <div class="memory-modal" id="memory-modal" hidden>
    <div class="memory-modal-backdrop" id="memory-modal-backdrop"></div>
    <div class="memory-modal-content">
      <div class="memory-modal-photo" id="memory-modal-photo"></div>
      <div class="memory-modal-fields">
        <label for="memory-modal-caption">Caption</label>
        <input type="text" id="memory-modal-caption" placeholder="Add a caption…" maxlength="80" />
        <label for="memory-modal-date">Date</label>
        <input type="date" id="memory-modal-date" />
        <div class="memory-modal-actions">
          <button class="btn btn-primary" id="memory-modal-save" type="button">Save</button>
          <button class="btn btn-ghost" id="memory-modal-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Shown right after a photo is picked, before it's uploaded — lets
       you set the caption and who the memory is of (Mark/Monica/Us)
       up front, instead of two separate browser prompt() popups
       (which, like confirm(), can get silently blocked in some in-app
       browsers). Same viewport-fixed sibling-of-body placement as the
       popups above. -->
  <div class="memory-modal" id="add-memory-modal" hidden>
    <div class="memory-modal-backdrop" id="add-memory-backdrop"></div>
    <div class="memory-modal-content">
      <div class="memory-modal-photo" id="add-memory-photo"></div>
      <div class="memory-modal-fields">
        <label for="add-memory-caption">Caption</label>
        <input type="text" id="add-memory-caption" placeholder="Add a caption…" maxlength="80" />
        <label for="add-memory-date">Date</label>
        <input type="date" id="add-memory-date" />
        <label id="add-memory-category-label">Whose memory is this?</label>
        <div class="category-picker" role="group" aria-labelledby="add-memory-category-label">
          <button class="category-btn active" data-category="us" type="button">Us</button>
          <button class="category-btn" data-category="mark" type="button">Mark</button>
          <button class="category-btn" data-category="monica" type="button">Monica</button>
        </div>
        <div class="memory-modal-actions">
          <button class="btn btn-primary" id="add-memory-save" type="button">Save</button>
          <button class="btn btn-ghost" id="add-memory-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom confirm dialog for deleting a memory — a real browser
       confirm() can get silently swallowed inside in-app browsers
       (Facebook/Instagram/Messenger link previews), so this is drawn
       on the page itself instead, and always shows. Same
       viewport-fixed sibling-of-body placement as the popup above. -->
  <div class="confirm-modal" id="delete-confirm-modal" hidden>
    <div class="confirm-modal-backdrop" id="delete-confirm-backdrop"></div>
    <div class="confirm-modal-content">
      <p id="delete-confirm-message">Delete this memory? This can't be undone.</p>
      <div class="confirm-modal-actions">
        <button class="btn btn-primary" id="delete-confirm-yes" type="button">Delete</button>
        <button class="btn btn-ghost" id="delete-confirm-no" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Global loading overlay, shown while a photo is uploading or
       being removed — same viewport-fixed sibling-of-body placement
       as the popups above, so it always covers the whole screen no
       matter where you've scrolled. -->
  <div class="loading-overlay" id="loading-overlay" hidden>
    <div class="loading-spinner" aria-hidden="true"></div>
    <p id="loading-overlay-message">Loading…</p>
  </div>

  <footer>made with care, just for you</footer>
</body>
</html>
