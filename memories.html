<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memories · You & Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="cloudinary-config.js"></script>
  <script defer src="jsonbin-config.js"></script>
  <script defer src="script.js"></script>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand"><span class="glyph">&#10084;</span> You &amp; Me</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="memories.html" class="active">Memories</a>
      <a href="gallery.html">Gallery</a>
      <a href="message.html">Message</a>
      <a href="ourstory.html">Our Story</a>
    </div>
  </nav>

  <section class="content fade-in">
    <span class="eyebrow">Snapshots</span>
    <h1>Our Memories</h1>
    <p class="lede">
      Tap "Add a memory" to upload a photo and a little caption. Tap any
      photo to edit its caption or add a date — it's all saved right in
      this browser, so it'll still be here next time you visit.
    </p>

    <div class="memories-layout">
      <aside class="memories-filters" role="tablist" aria-label="Filter memories">
        <button class="filter-btn active" data-filter="all" type="button" role="tab" aria-selected="true">All</button>
        <button class="filter-btn" data-filter="mark" type="button" role="tab" aria-selected="false">Mark</button>
        <button class="filter-btn" data-filter="monica" type="button" role="tab" aria-selected="false">Monica</button>
        <button class="filter-btn" data-filter="us" type="button" role="tab" aria-selected="false">Us</button>
      </aside>

      <div class="memories-grid" id="memories-grid">
        <button class="memory-card memory-add" id="add-memory-btn" type="button">
          <span class="add-icon">+</span>
          <span>Add a memory</span>
        </button>
      </div>
    </div>

    <input type="file" id="memory-file-input" accept="image/*" hidden />

    <div class="memory-modal" id="memory-modal" hidden>
      <div class="memory-modal-backdrop" id="memory-modal-backdrop"></div>
      <div class="memory-modal-content">
        <button class="memory-modal-close" id="memory-modal-close" type="button" aria-label="Close">&times;</button>
        <div class="memory-modal-photo" id="memory-modal-photo"></div>
        <div class="memory-modal-fields">
          <label for="memory-modal-caption">Caption</label>
          <input type="text" id="memory-modal-caption" placeholder="Add a caption…" maxlength="80" />
          <label for="memory-modal-date">Date</label>
          <input type="date" id="memory-modal-date" />
          <div class="memory-modal-actions">
            <button class="btn btn-primary" id="memory-modal-save" type="button">Save</button>
            <button class="btn btn-ghost" id="memory-modal-cancel" type="button">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer>made with care, just for you</footer>
</body>
</html>
